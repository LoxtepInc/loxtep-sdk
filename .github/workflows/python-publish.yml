name: Publish loxtep to PyPI

# Publishes via PyPI Trusted Publishing (OIDC) — no stored API token. Configure on pypi.org:
# https://pypi.org/manage/project/loxtep/settings/publishing/
#   (first publish: either publish once manually with a token to create the project, or
#   use PyPI's "pending publisher" flow to register a trusted publisher before the
#   project exists — https://docs.pypi.org/trusted-publishers/creating-a-project-through-oidc/)
#   → Add a new publisher → GitHub
#   Owner:      LoxtepInc
#   Repository: loxtep-sdk
#   Workflow:   python-publish.yml
#   Environment: (leave blank, or set to "pypi" and add environment: pypi below)
#
# Release (automatic): push a python-v-prefixed semver tag on main, e.g. python-v0.4.1
#   git tag python-v0.4.1 && git push origin python-v0.4.1
#
# NOTE: this uses a `python-v*` prefix, NOT the bare `v*` nodejs-publish.yml uses.
# Tag-push triggers don't support path filtering (unlike branch push/PR), so a bare
# `v*` tag would fire BOTH publish workflows — forcing nodejs/package.json's version
# to match this tag and attempting to publish the Node SDK to npm too. Keep these
# prefixes distinct.
#
# Release (manual): Actions → Run workflow (optional version / dry_run inputs)

on:
  push:
    tags:
      - 'python-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.0). Leave empty to use pyproject.toml version.'
        required: false
        type: string
      dry_run:
        description: 'Dry run (build + check only, skip the actual upload)'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build twine

      - name: Install package (with dev extras) for tests
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Set version from git tag
        if: startsWith(github.ref, 'refs/tags/python-v')
        run: |
          version="${GITHUB_REF_NAME#python-v}"
          sed -i "s/^version = \".*\"/version = \"${version}\"/" pyproject.toml

      - name: Set version (manual input)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ inputs.version }}\"/" pyproject.toml

      - name: Build
        run: python -m build

      - name: Verify package contents
        run: twine check dist/*

      - name: Publish
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          # OIDC via Trusted Publishing — no password/token needed.
