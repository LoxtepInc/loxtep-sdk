name: Publish @loxtep/sdk to npm

# Publishes via npm Trusted Publishing (OIDC). Configure on npmjs.com:
# https://www.npmjs.com/package/@loxtep/sdk/access
#   → Trusted Publisher → GitHub Actions
#   Repository: LoxtepInc/loxtep-sdk
#   Workflow:   nodejs-publish.yml
#   Allowed:    npm publish
#
# Or CLI (after npm login): npm trust github @loxtep/sdk --file nodejs-publish.yml --repository LoxtepInc/loxtep-sdk --allow-publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0). Leave empty to use package.json version.'
        required: false
        type: string
      dry_run:
        description: 'Dry run (publish --dry-run only)'
        required: false
        type: boolean
        default: false
      tag:
        description: 'npm dist-tag (e.g. latest, beta, next)'
        required: false
        type: string
        default: 'latest'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    defaults:
      run:
        working-directory: nodejs
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@latest

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.12.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version (if provided)
        if: inputs.version != ''
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish (dry run)
        if: inputs.dry_run == true
        run: npm publish --dry-run --access public --tag ${{ inputs.tag }}

      - name: Publish
        if: inputs.dry_run != true
        run: npm publish --access public --tag ${{ inputs.tag }}
        # OIDC via Trusted Publishing — no NPM_TOKEN. Provenance is automatic.
