name: Publish @loxtep/sdk to npm

# Publishes via npm Trusted Publishing (OIDC). Configure on npmjs.com:
# https://www.npmjs.com/package/@loxtep/sdk/access
#   → Trusted Publisher → GitHub Actions
#   Repository: LoxtepInc/loxtep-sdk
#   Workflow:   nodejs-publish.yml
#   Allowed:    npm publish
#
# Release (automatic): push a semver tag on main, e.g. v0.4.1
#   git tag v0.4.1 && git push origin v0.4.1
#
# Release (manual): Actions → Run workflow (optional version / dry_run / dist-tag inputs)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0). Leave empty to use package.json version.'
        required: false
        type: string
      dry_run:
        description: 'Dry run (publish --dry-run only)'
        required: false
        type: boolean
        default: false
      tag:
        description: 'npm dist-tag (e.g. latest, beta, next)'
        required: false
        type: string
        default: 'latest'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    defaults:
      run:
        working-directory: nodejs
    env:
      NPM_DIST_TAG: ${{ inputs.tag || 'latest' }}
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@latest

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Set version (manual input)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: npm publish --dry-run --access public --tag ${{ env.NPM_DIST_TAG }}

      - name: Publish
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        run: npm publish --access public --tag ${{ env.NPM_DIST_TAG }}
        # OIDC via Trusted Publishing — no NPM_TOKEN. Provenance is automatic.
