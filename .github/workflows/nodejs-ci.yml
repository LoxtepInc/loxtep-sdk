name: Node.js SDK CI

on:
  push:
    branches: [main]
    paths: ['nodejs/**', 'shared/**']
  pull_request:
    branches: [main]
    paths: ['nodejs/**', 'shared/**']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    defaults:
      run:
        working-directory: nodejs
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ESLint is not yet configured for this package (no config / not in
      # devDependencies). Do not invoke `pnpm run lint` until that lands — it
      # currently fails with `eslint: not found` and only muddies the job log.
      # TODO: add eslint + a flat config and make this a hard gate.
      - name: Lint
        run: echo "Skipping lint — eslint is not configured (see workflow TODO)."

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test
