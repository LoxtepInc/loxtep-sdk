[build-system]
# Upper-bound setuptools below 75: somewhere between 75.6 and 75.9, setuptools flips
# its default Metadata-Version from 2.1 to 2.2, and >=77 to 2.4 (PEP 639
# license-expression support). Older twine/pkginfo installs can't parse those newer
# spec versions — they misreport it as "Metadata is missing required fields: Name,
# Version" even though the fields are present. Pinning <75 keeps builds at the
# universally-readable Metadata-Version 2.1 (verified: setuptools 74.1.3 → 2.1).
requires = ["setuptools>=61,<75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loxtep"
version = "0.5.0"
description = "Loxtep Python SDK - data products, workflows, triggers, targets, queues"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
authors = [{ name = "Loxtep" }]
keywords = ["loxtep", "sdk", "data-mesh", "streaming"]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
streams = [
    "boto3>=1.28.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "boto3>=1.28.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
loxtep = "loxtep.cli:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
