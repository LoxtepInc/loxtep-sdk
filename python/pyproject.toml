[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loxtep"
version = "0.1.0"
description = "Loxtep Python SDK - data products, flows, projects, queues"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Loxtep" }]
keywords = ["loxtep", "sdk", "data-mesh", "streaming"]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
loxtep = "loxtep.cli:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
